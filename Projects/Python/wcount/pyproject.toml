[project]
name = "wcount"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Innovative Noctis", email = "arshiyaalizade.dev@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "puremagic>=2.2.0",
    "pypdf>=6.21.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "typer>=0.27.3",
]

[project.scripts]
wcount = "wcount:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
